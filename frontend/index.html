<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Graba y analiza tus reuniones con IA local. Sin nube, 100% privado." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:8765 http://localhost:11434 ws://localhost:5173 http://localhost:5173; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob: http://localhost:8765;" />
    <title>Local Meeting Analyzer</title>
    <style>
      /* Estilos críticos inline para pintar instantáneamente el splash antes de evaluar JS */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #090E17;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #090E17;
        background-image: radial-gradient(circle at 50% 38%, rgba(99, 102, 241, 0.12) 0%, rgba(9, 14, 23, 0) 65%);
        z-index: 99999;
        color: #F8FAFC;
        text-align: center;
      }
      .initial-splash-logo-wrap {
        position: relative;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .initial-splash-logo-glow {
        position: absolute;
        width: 120px;
        height: 120px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, rgba(99, 102, 241, 0) 70%);
        border-radius: 50%;
      }
      .initial-splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 24px rgba(99, 102, 241, 0.2);
        object-fit: cover;
        position: relative;
        z-index: 1;
      }
      .initial-splash-title {
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 6px 0;
        color: #F8FAFC;
        letter-spacing: -0.02em;
      }
      .initial-splash-tagline {
        font-size: 13px;
        color: #94A3B8;
        margin: 0 0 32px 0;
      }
      .initial-splash-track {
        width: 280px;
        height: 5px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 16px;
        position: relative;
      }
      .initial-splash-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 35%;
        background: linear-gradient(90deg, #6366F1 0%, #8B5CF6 100%);
        border-radius: 999px;
        animation: initialSplashProgress 1.5s ease-in-out infinite;
      }
      .initial-splash-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 13px;
        color: #94A3B8;
        font-weight: 500;
      }
      .initial-splash-spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(99, 102, 241, 0.25);
        border-top-color: #6366F1;
        border-radius: 50%;
        animation: initialSplashSpin 0.8s linear infinite;
      }
      @keyframes initialSplashSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes initialSplashProgress {
        0% { left: 0%; width: 15%; }
        50% { left: 35%; width: 45%; }
        100% { left: 100%; width: 15%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash">
        <div class="initial-splash-logo-wrap">
          <div class="initial-splash-logo-glow"></div>
          <img src="./icon.png" alt="Local Meeting Analyzer" class="initial-splash-logo" />
        </div>
        <h1 class="initial-splash-title">Local Meeting Analyzer</h1>
        <p class="initial-splash-tagline">Grabación y análisis privado con IA local</p>
        <div class="initial-splash-track">
          <div class="initial-splash-bar"></div>
        </div>
        <div class="initial-splash-status">
          <span class="initial-splash-spinner"></span>
          <span>Iniciando aplicación...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
